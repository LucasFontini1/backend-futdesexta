name: Backend autoformat
on:
  push:
    branches: ['feature/foundation-security-20261030', 'feature/scheduling-integrity-20261030']
permissions:
  contents: write
concurrency:
  group: backend-formatter
  cancel-in-progress: true
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Formata pastas em commits separados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for folder in app core/models core/serializers core/views core/services core/tests core/management scripts; do
            ruff check --select I,F --fix "$folder"
            ruff format "$folder"
            git add "$folder"
            if ! git diff --cached --quiet; then
              git commit -m "style($folder): padroniza Python com Ruff"
            fi
          done
          git push
